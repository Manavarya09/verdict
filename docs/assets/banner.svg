<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Verdict: small, fast, honest decision models">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0c0f"/><stop offset="1" stop-color="#121a22"/></linearGradient>
    <linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#6ee7c8"/><stop offset="1" stop-color="#8ab4ff"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <g opacity=".35" stroke="#1f2630"><path d="M0 100H1280M0 200H1280M0 300H1280M160 0V400M320 0V400M480 0V400M640 0V400M800 0V400M960 0V400M1120 0V400"/></g>
  <!-- decision bars -->
  <g transform="translate(820,86)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8f9aa8">
    <rect x="-24" y="-30" width="404" height="288" rx="14" fill="#12171d" stroke="#1f2630"/>
    <text x="0" y="-4" fill="#6ee7c8" font-size="13">v.choose("billed twice, refund or we cancel", …)</text>
    <g transform="translate(0,26)"><text y="12" fill="#eef1f4" font-weight="600">billing</text><rect x="120" y="2" width="220" height="12" rx="6" fill="#1c232c"/><rect x="120" y="2" width="156" height="12" rx="6" fill="url(#acc)"/><text x="350" y="12" text-anchor="end" fill="#eef1f4">71.2%</text></g>
    <g transform="translate(0,58)"><text y="12">technical</text><rect x="120" y="2" width="220" height="12" rx="6" fill="#1c232c"/><rect x="120" y="2" width="42" height="12" rx="6" fill="#4b5563"/><text x="350" y="12" text-anchor="end">18.9%</text></g>
    <g transform="translate(0,90)"><text y="12">sales</text><rect x="120" y="2" width="220" height="12" rx="6" fill="#1c232c"/><rect x="120" y="2" width="22" height="12" rx="6" fill="#4b5563"/><text x="350" y="12" text-anchor="end">9.9%</text></g>
    <g transform="translate(0,134)"><text y="12" fill="#6ee7c8">✓ commits</text><text x="120" y="12">conformal set = ["billing"]</text></g>
    <g transform="translate(0,164)"><text y="12">coverage 0.90</text><text x="120" y="12">ECE 0.020 · 0.6 ms</text></g>
    <g transform="translate(0,212)"><text y="12" fill="#ffb86b">↩ abstains</text><text x="120" y="12">when it cannot rule out a second label</text></g>
  </g>
  <!-- wordmark -->
  <text x="72" y="150" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="700" fill="#eef1f4" letter-spacing="-2">verdict</text>
  <text x="72" y="200" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#8f9aa8">small, fast, <tspan fill="url(#acc)" font-weight="600">honest</tspan> decision models</text>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#8f9aa8" transform="translate(72,250)">
    <g><rect width="220" height="34" rx="17" fill="#12171d" stroke="#1f2630"/><text x="16" y="22" fill="#eef1f4">zero-shot · fit in seconds</text></g>
    <g transform="translate(232,0)"><rect width="250" height="34" rx="17" fill="#12171d" stroke="#1f2630"/><text x="16" y="22" fill="#eef1f4">calibrated · coverage guarantee</text></g>
    <g transform="translate(0,44)"><rect width="200" height="34" rx="17" fill="#12171d" stroke="#1f2630"/><text x="16" y="22" fill="#eef1f4">CPU · browser · 100+ langs</text></g>
    <g transform="translate(212,44)"><rect width="270" height="34" rx="17" fill="#12171d" stroke="#1f2630"/><text x="16" y="22" fill="#eef1f4">Jev wire-compatible · Apache-2.0</text></g>
  </g>
  <circle cx="1180" cy="60" r="90" fill="#6ee7c8" opacity=".08" filter="url(#glow)"/>
</svg>
