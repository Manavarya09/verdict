[project]
name = "verdictml"
version = "0.1.0"
description = "Verdict: small, fast, calibrated decision models. Replace LLM calls for routing, guardrails and policy checks with typed answers in milliseconds."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Verdict contributors" }]
keywords = ["decision-model", "classification", "routing", "guardrails", "calibration", "conformal", "nli", "zero-shot", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "torch>=2.2",
  "transformers>=4.44",
  "sentence-transformers>=3.0",
  "huggingface-hub>=0.24",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
onnx = ["onnxruntime>=1.18", "optimum>=1.20"]
train = ["datasets>=2.20", "scikit-learn>=1.4", "accelerate>=0.30"]
bench = ["datasets>=2.20", "scikit-learn>=1.4", "pandas>=2.2"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
verdict = "verdict.cli:app"

[project.urls]
Homepage = "https://github.com/verdict-ai/verdict"
Documentation = "https://github.com/verdict-ai/verdict/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E741", "B008", "B905", "B027"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: downloads models and runs inference"]
