name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev,serve,bench]"
      - name: lint
        run: uv run --no-sync ruff check src tests bench
      - name: unit tests
        run: uv run --no-sync pytest -m "not slow"
  slow:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-e5-small
      - name: install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev,serve,bench]"
      - name: model tests
        run: uv run --no-sync pytest -m slow
  sdk-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/verdict-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npx tsc -p .
      - run: npm test
